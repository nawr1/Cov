<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Voyage Pro</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-stats {
            transition: transform 0.3s;
            border: none;
        }
        .card-stats:hover {
            transform: translateY(-10px);
        }
        .icon-shape {
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 24px;
        }
    </style>
</head>
<body class="bg-light">

<!-- Barre de Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-plane-departure me-2"></i>CovFacile</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/}">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/users}">Utilisateurs</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trips}">Voyages</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservations}">Réservations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Header -->
    <div class="row mb-5">
        <div class="col-md-12 text-center">
            <h2 class="display-4 fw-bold text-dark">Bienvenue dans votre système de gestion de covoiturage.</2>
        </div>
    </div>

    <!-- Cartes de Statistiques -->
    <div class="row g-4 mb-5">
        <!-- Carte Utilisateurs -->
        <div class="col-md-4">
            <div class="card card-stats bg-primary text-white shadow">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1">Utilisateurs</h6>
                            <h2 class="mb-0 fw-bold">Gérer</h2>
                        </div>
                        <div class="icon-shape">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                    <hr>
                    <a th:href="@{/users}" class="text-white text-decoration-none small">
                        Voir la liste <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Carte Voyages -->
        <div class="col-md-4">
            <div class="card card-stats bg-success text-white shadow">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1">Voyages</h6>
                            <h2 class="mb-0 fw-bold">Disponibles</h2>
                        </div>
                        <div class="icon-shape">
                            <i class="fas fa-route"></i>
                        </div>
                    </div>
                    <hr>
                    <a th:href="@{/trips}" class="text-white text-decoration-none small">
                        Voir les trajets <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Carte Réservations -->
        <div class="col-md-4">
            <div class="card card-stats bg-info text-white shadow">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1">Réservations</h6>
                            <h2 class="mb-0 fw-bold">Suivi</h2>
                        </div>
                        <div class="icon-shape">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                    </div>
                    <hr>
                    <a th:href="@{/reservations}" class="text-white text-decoration-none small">
                        Gérer les billets <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Section Actions Rapides -->
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="mb-4 fw-bold"><i class="fas fa-bolt me-2 text-warning"></i>Actions Rapides</h5>
                <div class="row text-center">
                    <div class="col-4">
                        <a th:href="@{/users/add}" class="btn btn-outline-primary w-100 p-3">
                            <i class="fas fa-user-plus d-block mb-2"></i> Nouvel Utilisateur
                        </a>
                    </div>
                    <div class="col-4">
                        <a th:href="@{/trips/add}" class="btn btn-outline-success w-100 p-3">
                            <i class="fas fa-plus-circle d-block mb-2"></i> Créer Voyage
                        </a>
                    </div>
                    <div class="col-4">
                        <a th:href="@{/reservations/add}" class="btn btn-outline-info w-100 p-3">
                            <i class="fas fa-calendar-check d-block mb-2"></i> Réserver
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
