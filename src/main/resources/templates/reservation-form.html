<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle Réservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Faire une Réservation</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/reservations/add}" method="post">

                        <!-- Sélection de l'utilisateur -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Choisir un Utilisateur :</label>
                            <select name="userId" class="form-select" required>
                                <option value="" disabled selected>Sélectionnez un passager...</option>
                                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"></option>
                            </select>
                        </div>

                        <!-- Sélection du voyage -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Choisir un Voyage :</label>
                            <select name="tripId" class="form-select" required>
                                <option value="" disabled selected>Sélectionnez un trajet...</option>
                                <!-- CORRECTION ICI : on affiche startCity et endCity -->
                                <option th:each="t : ${trips}"
                                        th:value="${t.id}"
                                        th:text="${t.startCity} + ' vers ' + ${t.endCity} + ' (' + ${t.price} + ' DH)'">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Confirmer la Réservation</button>
                            <a th:href="@{/reservations}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
