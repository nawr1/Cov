<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Réservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Liste des Réservations</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary">Accueil</a>
            <a th:href="@{/reservations/add}" class="btn btn-primary">Nouvelle Réservation</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Utilisateur</th>
                    <th>Voyage (Itinéraire)</th>
                    <th>Statut</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservations}">
                    <td th:text="${r.user.name}"></td>
                    <!-- Correction ici : on utilise startCity et endCity -->
                    <td th:text="${r.trip.startCity} + ' ➔ ' + ${r.trip.endCity}"></td>
                    <td>
                        <span th:text="${r.status}"
                              class="badge"
                              th:classappend="${r.status.name() == 'CONFIRMED' ? 'bg-success' : (r.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}">
                        </span>
                    </td>
                    <td class="text-center">
                        <div class="btn-group">
                            <a th:href="@{/reservations/confirm/{id}(id=${r.id})}" class="btn btn-outline-success btn-sm">Confirmer</a>
                            <a th:href="@{/reservations/cancel/{id}(id=${r.id})}" class="btn btn-outline-warning btn-sm">Annuler</a>
                            <a th:href="@{/reservations/delete/{id}(id=${r.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Supprimer ?')">Supprimer</a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="4" class="text-center text-muted">Aucune réservation pour le moment.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
