<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Voyage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Créer un Nouveau Trajet</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/trips/add}" th:object="${trip}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Ville de Départ</label>
                            <input type="text" th:field="*{startCity}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ville d'Arrivée</label>
                            <input type="text" th:field="*{endCity}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date de départ</label>
                            <input type="date" th:field="*{startDate}" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Prix (DH)</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Places</label>
                                <input type="number" th:field="*{placeAvail}" class="form-control" required>
                            </div>
                        </div>

                        <!-- LE FIX EST ICI -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-primary">Conducteur</label>
                            <select th:field="*{conductor}" class="form-select" required>
                                <option value="" disabled selected>Choisir le conducteur...</option>
                                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"></option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Enregistrer le voyage</button>
                            <a th:href="@{/trips}" class="btn btn-light border">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
