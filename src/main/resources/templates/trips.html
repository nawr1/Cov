<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Voyages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Liste des Voyages Disponibles</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary">Accueil</a>
            <a th:href="@{/trips/add}" class="btn btn-primary">Ajouter un Voyage</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Départ</th>
                    <th>Arrivée</th>
                    <th>Date</th>
                    <th>Prix</th>
                    <th>Places</th>
                    <th>Conducteur</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${trips}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.startCity}"></td>
                    <td th:text="${t.endCity}"></td>
                    <!-- Formatage de la date en jour/mois/année -->
                    <td th:text="${#dates.format(t.startDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${t.price} + ' DH'"></td>
                    <td th:text="${t.placeAvail}"></td>
                    <!-- Affiche le nom du conducteur s'il existe -->
                    <td th:text="${t.conductor != null ? t.conductor.name : 'Aucun'}"></td>
                    <td class="text-center">
                        <a th:href="@{/trips/delete/{id}(id=${t.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Supprimer ce voyage ?')">
                            Supprimer
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(trips)}">
                    <td colspan="8" class="text-center text-muted">Aucun voyage trouvé.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
