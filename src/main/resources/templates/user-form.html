<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Utilisateur</title>
    <!-- Lien Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- La carte (Card) pour un joli contour -->
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Ajouter un Utilisateur</h3>
                </div>
                <div class="card-body p-4">

                    <!-- Formulaire Thymeleaf -->
                    <form th:action="@{/users/add}" th:object="${user}" method="post">

                        <!-- Champ Nom -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nom complet :</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Ex: Jean Dupont" required>
                        </div>

                        <!-- Champ Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email :</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="nom@exemple.com" required>
                        </div>

                        <!-- Boutons -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Enregistrer</button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary">Annuler</a>
                        </div>

                    </form>

                </div>
            </div>
            <!-- Petit lien de retour rapide -->
            <p class="text-center mt-3">
                <a th:href="@{/}" class="text-decoration-none text-muted">← Retour à l'accueil</a>
            </p>
        </div>
    </div>
</div>

<!-- Optionnel : Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
