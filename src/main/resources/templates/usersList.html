<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Utilisateurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Liste des Utilisateurs</h2>
<a th:href="@{/users/add}" class="btn btn-primary mb-3">Ajouter un Utilisateur</a>
<a th:href="@{/}" class="btn btn-secondary mb-3">Retour</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th> <th>Nom</th> <th>Email</th> <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.email}"></td>
        <td>
            <a th:href="@{/users/delete/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
               onclick="return confirm('Supprimer ?')">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
